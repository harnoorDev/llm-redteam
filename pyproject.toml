[project]
name = "llm-redteam"
version = "1.0.0"
description = "Full-spectrum LLM & web-app red-team harness: 35+ attack strategies, PAIR/evolutionary loops, graded judge panel, proxy testers, memory, Studio UI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Harnoor Singh" }]
requires-python = ">=3.11"
keywords = [
    "llm", "red-team", "jailbreak", "security", "ai-safety",
    "pentest", "owasp", "pair", "adversarial-ml",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Core stays deliberately small: the CLI, the full 69-strategy arsenal, the
# judge and every report renderer need only these two. The Studio UI and the
# MCP server are opt-in extras so `uvx` cold-starts stay fast.
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/harnoorDev/llm-redteam"
Documentation = "https://github.com/harnoorDev/llm-redteam#readme"
Issues = "https://github.com/harnoorDev/llm-redteam/issues"

[project.optional-dependencies]
# Studio web UI: `redteam-studio`
studio = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]
# MCP server: `redteam-mcp` (offline tools only — never contacts a target)
# 2.0 renamed FastMCP -> MCPServer; mcp_server.py handles both majors,
# and this is the range actually tested. Deliberately bounded.
mcp = ["mcp>=1.9,<3"]
# Sharper multimodal PNGs; a pure-Python fallback ships in-tree
image = ["Pillow>=10.0"]
all = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "mcp>=1.9,<3",
    "Pillow>=10.0",
]

[project.scripts]
redteam = "redteam.cli:main"
redteam-studio = "redteam.studio_cli:main"
redteam-mcp = "redteam.mcp_server:main"

[dependency-groups]
dev = [
    # the suite covers the Studio and MCP surfaces, so dev needs both extras
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "mcp>=1.9,<3",
    "pytest>=8.0",
    "respx>=0.23",
    "pytest-httpx>=0.36.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["redteam*"]

[tool.setuptools.package-data]
redteam = ["ui/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=redteam --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["redteam"]
omit = ["*/ui/*"]

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# ISC (implicit string concatenation) is intentionally NOT enforced: the attack
# corpus uses multi-line adjacent string literals for long adversarial prompts.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE", "PLW", "S"]
ignore = [
    "S101",  # assert is fine (used in tests + light runtime checks)
    "S603",  # subprocess call: this harness legitimately spawns runners
    "S607",  # partial executable path: intentional (ps/kill/uv)
    "S310",  # urllib url-open: the HTTP testers deliberately probe target URLs
    "S311",  # non-crypto random: used only for retry-backoff jitter, not secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "F841", "B", "PLW"]
# HTML report templates contain intentionally long literal lines
"src/redteam/reporting/*" = ["E501"]
# Unicode homoglyph/superscript tables are escape-sequence maps; wrapping them
# splits a single logical translation table across lines and hurts readability
"src/redteam/encoders.py" = ["E501"]
