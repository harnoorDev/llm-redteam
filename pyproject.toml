[project]
name = "llm-redteam"
version = "1.0.0"
description = "Full-spectrum LLM & web-app red-team harness: 35+ attack strategies, PAIR/evolutionary loops, graded judge panel, proxy testers, memory, Studio UI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Harnoor Singh" }]
requires-python = ">=3.11"
keywords = [
    "llm", "red-team", "jailbreak", "security", "ai-safety",
    "pentest", "owasp", "pair", "adversarial-ml",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[project.urls]
Homepage = "https://github.com/harnoorsingh/llm-redteam"
Documentation = "https://github.com/harnoorsingh/llm-redteam#readme"
Issues = "https://github.com/harnoorsingh/llm-redteam/issues"

[project.scripts]
redteam = "redteam.cli:main"
redteam-studio = "redteam.studio_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.23",
    "pytest-httpx>=0.36.2",
]

[build-system]
requires = ["uv_build>=0.5", "setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redteam = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]