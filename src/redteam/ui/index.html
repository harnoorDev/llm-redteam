<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HERMES · RedTeam Studio</title>
<link rel="stylesheet" href="/ui/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
</head>
<body>
<div class="bg-grid"></div>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo">🐉</span>
      <div>
        <div class="brand-name">REDTEAM<span class="accent">.STUDIO</span></div>
        <div class="brand-sub">hermes agent harness</div>
      </div>
    </div>
    <nav class="nav">
      <a data-view="dashboard" class="nav-item active"><span>⚡</span> Dashboard</a>
      <a data-view="launch" class="nav-item"><span>🚀</span> Launch</a>
      <a data-view="jobs" class="nav-item"><span>🎛</span> Job Control <span id="nav-jobs-badge" class="badge" hidden>0</span></a>
      <a data-view="history" class="nav-item"><span>📚</span> History</a>
      <a data-view="memory" class="nav-item"><span>🧠</span> Memory</a>
      <a data-view="findings" class="nav-item"><span>🕵</span> App Findings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="pulse-dot"></div>
      <span id="backend-status">connecting…</span>
    </div>

  <!-- ============ MAIN ============ -->
  <main id="main"></main>

<script src="/ui/app.js"></script>

</html>
